<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp</title>
    <link rel="stylesheet" href="../css/signup.css">
</head>
<body>
    <div class="container">
        <h1>회원가입페이지</h1>
        <div class="form-container">
            <form action="../html/main.html" method="post">
                <input type="text" id="username" name="username" required class="input-box" placeholder="이름">
                <br>
                <input type="date" id="birthdate" name="birthdate" required class="input-box" placeholder="생년월일">
                <br>
                <input type="email" id="email" name="email" required class="input-box" placeholder="이메일">
                <br>
                <input type="password" id="password" name="password" required class="input-box" placeholder="비밀번호">
                <br>
                <input type="password" id="confirm-password" name="confirm-password" required class="input-box" placeholder="비밀번호 확인">
                <br>
                <button type="submit">회원가입</button>
            </form>
            <p>이미 회원이신가요? <a href="../html/login.html">로그인</a></p>
        </div>
    </div>    
</body>
</html>
