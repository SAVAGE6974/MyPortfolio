<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="container">
        <h1>로그인 페이지</h1>
        <div class="form-container">
            <form action="../html/main.html" method="post">
                <input type="email" id="username" name="username" required class="input-box" placeholder="사용자 이메일">
                <br>
                <input type="password" id="password" name="password" required class="input-box" placeholder="비밀번호">
                <br>
                <button type="submit">로그인</button>
            </form>
            <p>아직 회원이 아니신가요? <a href="../html/signup.html">회원가입</a></p>
        </div>
    </div>
</body>
</html>
